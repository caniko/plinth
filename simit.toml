[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"
nix_builds = [
  ".#packages.x86_64-linux.plinth-cli",
  ".#packages.x86_64-linux.plinth-project",
  ".#packages.x86_64-linux.plinth-aarch64-linux",
]

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runner = "ubuntu-24.04"
workspace = true
workspace_strategy = "aggregate"
runtime = "nix"
provider = "actions"
platform = "github"
extra_setup = ["nix develop -c ./scripts/dev-db.sh start"]
all_features = false

[ci.pages]
repo = "caniko/plinth"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "plinth"
token_secret = "ATTIC_TOKEN"
