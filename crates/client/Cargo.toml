[package]
name = "plinth-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plinth-shared = { workspace = true, default-features = false }
chrono = { workspace = true }
serde = { workspace = true }

# Leptos core
leptos = { workspace = true, features = ["csr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# SSR-only: database access for server functions
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Storage", "MediaQueryList", "HtmlElement", "Document", "Element", "DomTokenList"] }

[features]
default = ["csr", "brick-blog", "brick-portfolio", "brick-todo"]
brick-blog = ["plinth-shared/brick-blog"]
brick-portfolio = ["plinth-shared/brick-portfolio"]
brick-todo = ["plinth-shared/brick-todo"]
csr = ["leptos/csr"]
hydrate = ["leptos/hydrate"]
ssr = ["dep:serde_json"]
