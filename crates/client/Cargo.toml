[package]
name = "plinth-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
plinth-shared = { workspace = true, default-features = false }
chrono = { workspace = true }
serde = { workspace = true }

# Leptos core
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# SSR-only: database access for server functions
futures = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }

# CSR-only: browser REST client for static/client-only deployments
gloo-net = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
send_wrapper = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "MediaQueryList",
    "Storage",
    "Window",
] }

[features]
default = ["csr", "islands", "brick-blog", "brick-portfolio", "brick-todo", "brick-activity"]
brick-blog = ["plinth-shared/brick-blog"]
brick-portfolio = ["plinth-shared/brick-portfolio"]
brick-todo = ["plinth-shared/brick-todo"]
brick-activity = ["plinth-shared/brick-activity"]
csr = ["leptos/csr", "dep:gloo-net", "dep:percent-encoding", "dep:send_wrapper"]
hydrate = ["leptos/hydrate"]
islands = ["leptos/islands"]
ssr = ["dep:futures", "dep:serde_json", "dep:sqlx", "dep:tokio", "plinth-shared/config-toml"]
