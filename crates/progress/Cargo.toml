[package]
name = "plinth-progress"
version.workspace = true
edition.workspace = true
description = "Validate and version-guard Plinth project progress sources"

[[bin]]
name = "plinth-progress"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
plinth-project = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Test-only JSON Schema validation. No network resolver is enabled, so the
# schema and fixtures only ever come from this checkout.
boon = { version = "0.6.1", default-features = false }
serde_json = { workspace = true }
