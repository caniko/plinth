[workspace]
# Own workspace: the rest of Plinth is pinned to Dioxus 0.7.10 and the root
# Cargo.lock is a Nix contract input, so this crate keeps a separate lockfile.
members = ["."]
resolver = "2"

[package]
name = "plinth-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dioxus 0.8 workspace module for writing and publishing Plinth posts from a host desktop app"
publish = false

[features]
default = []
# Renderer for the `preview` example only; the library itself is renderer-agnostic.
desktop = ["dioxus/desktop", "dioxus/launch"]

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", default-features = false, features = [
    "macro",
    "html",
    "signals",
    "hooks",
] }
plinth-shared = { path = "../shared", default-features = false, features = ["brick-blog"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "net"] }

[[example]]
name = "preview"
required-features = ["desktop"]
