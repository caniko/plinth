[[pages.sections]]
type = "partnerships"
id = "partners"
eyebrow = "03 / OUR PARTNERS"
heading = "Better, together."
partners = [] # Add partnerships when you have relationships to describe.

[[pages.sections]]
type = "contact"
id = "contact"
eyebrow = "04 / WHAT’S NEXT"
heading = "Let’s make\nsomething matter."
intro = "Tell us what you’re thinking. We’ll start with a conversation."
label = "Get in touch ↗"
href = "mailto:hello@example.com"

