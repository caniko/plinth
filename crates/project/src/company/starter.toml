href = "#contact"
primary = true

[[members]]
id = "founder"
name = "Your name"
role = "Founder"
bio = "Introduce the person and the perspective they bring."

[[pages]]
slug = "index"
title = __TITLE__
description = __DESCRIPTION__

[[pages.sections]]
type = "hero"
eyebrow = "INDEPENDENT BY DESIGN"
title = "Good ideas.\nBetter together."
tagline = __DESCRIPTION__
subtitle = ""
[[pages.sections.ctas]]
label = "Start a conversation ↗"
href = "#contact"
primary = true
[[pages.sections.ctas]]
label = "Meet the team ↓"
href = "#team"

[[pages.sections]]
type = "mission"
id = "mission"
eyebrow = "01 / OUR PURPOSE"
heading = "Good work,\nwith good people."
statement = "Explain the change your company exists to make, and why it matters."
[[pages.sections.values]]
title = "Thoughtful by default"
description = "Describe a principle that shapes the way you work."
[[pages.sections.values]]
title = "Built together"
description = "Describe how you collaborate with your clients and partners."

[[pages.sections]]
type = "team"
id = "team"
eyebrow = "02 / OUR PEOPLE"
heading = "Small team.\nShared ambition."
intro = "Good relationships are the foundation of good work."
