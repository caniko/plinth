[package]
name = "plinth-project"
version.workspace = true
edition.workspace = true
description = "Modular static project and company sites: renderer, diagnostics, CLI, and dev server"

[features]
default = [
    "brick-hero",
    "brick-feature-grid",
    "brick-install",
    "brick-screenshot-grid",
    "brick-capability-matrix",
    "brick-comparison",
    "brick-custom",
    "brick-person-mention",
    "brick-workflow-steps",
    "brick-audience-grid",
    "brick-trust-panel",
    "brick-content",
    "brick-project-grid",
    "brick-company",
    "brick-blog",
]
brick-hero = []
brick-feature-grid = []
brick-install = []
brick-screenshot-grid = []
brick-capability-matrix = []
brick-comparison = []
brick-custom = []
brick-person-mention = []
brick-workflow-steps = []
brick-audience-grid = []
brick-trust-panel = []
brick-content = []
brick-project-grid = []
brick-company = []
brick-blog = ["dep:chrono", "dep:gray_matter", "dep:pulldown-cmark"]

[[bin]]
name = "plinth-project"
path = "src/main.rs"

[[bin]]
name = "plinth-company"
path = "src/company_main.rs"
required-features = ["brick-company", "brick-hero"]

[dependencies]
tartan-ui-assets.workspace = true
plinth-person = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive", "env"] }
gray_matter = { workspace = true, optional = true }
notify = { workspace = true }
open = { workspace = true }
pulldown-cmark = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
