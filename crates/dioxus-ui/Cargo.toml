[package]
name = "plinth-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Dioxus web application for Plinth"

[features]
default = ["web", "brick-blog", "brick-portfolio", "brick-todo", "brick-activity"]
web = ["dioxus/web", "dioxus/fullstack", "tartan-ui-dioxus/web", "dep:web-sys"]
server = ["dioxus/server", "dioxus/fullstack", "tartan-ui-dioxus/server", "dep:plinth-server", "dep:axum", "dep:tokio", "dep:tower-http", "dep:tracing"]
devtools = ["dioxus/devtools", "tartan-ui-dioxus/devtools"]
release-wasm-split = ["dioxus/wasm-split", "dioxus-router/wasm-split", "tartan-ui-dioxus/wasm-split"]
brick-blog = ["plinth-shared/brick-blog", "plinth-server?/brick-blog"]
brick-portfolio = ["plinth-shared/brick-portfolio", "plinth-server?/brick-portfolio"]
brick-todo = ["plinth-shared/brick-todo", "plinth-server?/brick-todo"]
brick-activity = ["plinth-shared/brick-activity", "plinth-server?/brick-activity"]

[dependencies]
dioxus = { workspace = true }
dioxus-router = { workspace = true }
plinth-shared = { workspace = true, default-features = false }
plinth-server = { path = "../server", optional = true, default-features = false, features = ["ssr"] }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "macros", "signal", "net", "time", "sync"] }
tower-http = { workspace = true, optional = true, features = ["fs", "set-header", "compression-gzip", "compression-br", "limit", "trace"] }
tracing = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Window", "Storage", "HtmlElement", "DomTokenList"] }
tartan-ui-core = { workspace = true }
tartan-ui-dioxus = { workspace = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "plinth-web"
path = "src/main.rs"
