[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Workspace dependencies
client = { workspace = true, default-features = false, features = ["hydrate"] }
shared = { workspace = true }

# Leptos SSR
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }

# Server
axum = { workspace = true, optional = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs", "trace"], optional = true }

# Observability & Tracing (OPTIONAL - gated by ssr feature)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Actor System
kameo = { workspace = true, optional = true }

# Database & Vector Search
surrealdb = { workspace = true, optional = true, features = ["kv-rocksdb"] }
tonic = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }

# Content Processing
pulldown-cmark = { workspace = true }
gray_matter = { workspace = true }
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[features]
default = ["ssr"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:kameo",
    "dep:surrealdb",
    "dep:fastembed",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "leptos/ssr",
    "dep:tonic",
]

[package.metadata.leptos]
# Output name for the server binary and WASM
output-name = "personal-website"

# The site root folder is where cargo-leptos generate all output
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
site-pkg-dir = "pkg"

# The source style file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS.
style-file = "../../input.css"

# The tailwind input file
tailwind-input-file = "../../input.css"

# The tailwind config file
tailwind-config-file = "../../tailwind.config.js"

# Assets source dir. All files found here will be copied and synchronized to site-root.
assets-dir = "../../public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually `DEV` or `PROD`
env = "DEV"

# The features to use when compiling the bin target
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
bin-default-features = false

# The features to use when compiling the lib target (client package)
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
lib-default-features = false

# The profile to use for the lib target when compiling for release
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
