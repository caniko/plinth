[package]
name = "plinth-server"
version.workspace = true
edition.workspace = true

[lib]
name = "plinth_server"
path = "src/lib.rs"

[[bin]]
name = "plinth-server"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Workspace dependencies
plinth-client = { workspace = true, default-features = false, features = ["hydrate", "ssr"] }
plinth-forge = { path = "../forge", optional = true }
plinth-shared = { workspace = true, default-features = false, features = ["config-toml"] }

# Leptos SSR
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }

# Server
axum = { workspace = true, optional = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs", "trace", "compression-gzip", "compression-br", "set-header", "limit"], optional = true }
tower_governor = { workspace = true, optional = true }

# Observability & Tracing (OPTIONAL - gated by ssr feature)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Actor System
kameo = { workspace = true, optional = true }

# Database & Vector Search
sqlx = { workspace = true, optional = true }
pgvector = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }

# HTTP Client (for Immich image proxy)
reqwest = { workspace = true, features = ["json", "stream"], optional = true }
uuid = { workspace = true, optional = true }

# RSS Feeds
rss = { workspace = true, optional = true }

# Content Processing
pulldown-cmark = { workspace = true }
gray_matter = { workspace = true }
chrono = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true, optional = true }

[features]
default = ["ssr", "brick-blog", "brick-portfolio", "brick-todo", "brick-activity"]
brick-blog = ["plinth-client/brick-blog", "plinth-shared/brick-blog"]
brick-portfolio = ["plinth-client/brick-portfolio", "plinth-shared/brick-portfolio"]
brick-todo = ["plinth-client/brick-todo", "plinth-shared/brick-todo"]
brick-activity = ["dep:plinth-forge", "plinth-client/brick-activity", "plinth-shared/brick-activity"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:kameo",
    "dep:sqlx",
    "dep:pgvector",
    "dep:fastembed",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "leptos/ssr",
    "dep:tonic",
    "dep:reqwest",
    "dep:uuid",
    "dep:toml",
    "dep:rss",
    "dep:tower_governor",
]

[dev-dependencies]
async-trait = "0.1"
tower = { workspace = true, features = ["util"] }
wiremock = "0.6"
