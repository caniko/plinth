[package]
name = "server"
version.workspace = true
edition.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Workspace dependencies
client = { workspace = true, default-features = false, features = ["hydrate"] }
shared = { workspace = true }

# Leptos SSR
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }

# Server
axum = { workspace = true, optional = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"], optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, features = ["fs", "trace"], optional = true }

# Observability & Tracing (OPTIONAL - gated by ssr feature)
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

# Actor System
kameo = { workspace = true, optional = true }

# Database & Vector Search
surrealdb = { workspace = true, optional = true, features = ["kv-rocksdb", "kv-mem"] }
tonic = { workspace = true, optional = true }
fastembed = { workspace = true, optional = true }

# Content Processing
pulldown-cmark = { workspace = true }
gray_matter = { workspace = true }
chrono = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[features]
default = ["ssr"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:kameo",
    "dep:surrealdb",
    "dep:fastembed",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "leptos/ssr",
    "dep:tonic",
]

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

