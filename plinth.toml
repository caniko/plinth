# Plinth Configuration — populated for full testing

[site]
name = "Can's Lab"
base_url = ""
tagline = "Systems, science, and software"
description = "Personal website and blog of Can — covering Rust, neuroscience, and open-source tooling"
lang = "en"
default_theme = "dark"

[site.author]
name = "Can Tartanoglu"
email = "can@example.com"

[site.social]
github = "https://github.com/caniko"
gitlab = "https://gitlab.com/caniko"
codeberg = "https://codeberg.org/caniko"
mastodon = "https://fosstodon.org/@caniko"
bluesky = ""

[site.footer]
project_name = "Plinth"
project_url = "https://codeberg.org/caniko/plinth"

[[site.nav]]
label = "Posts"
path = "/posts"

[[site.nav]]
label = "Projects"
path = "/projects"

[[site.nav]]
label = "Bucket List"
path = "/todos"

[[site.nav]]
label = "About"
path = "/about"

[pages.home]
title = "Can's Lab"
description = "Welcome — posts on Rust, neuroscience, and open-source projects"

[pages.blog]
title = "Posts"
subtitle = "Writings on code, science, and everything in between"
description = "Blog posts by Can covering Rust, systems programming, and neuroscience research"

[pages.portfolio]
title = "Projects"
subtitle = "Open-source work and research tools"
description = "A selection of open-source projects and research software"

[pages.todos]
title = "Bucket List"
subtitle = "Things I want to accomplish"
description = "My public TODO list and bucket list"

[pages.about]
title = "About Me"
description = "Background, interests, and how to get in touch"

[server]
host = "127.0.0.1"
port = 3000

[database]
database_url = "postgres://plinth:plinth@localhost:5432/plinth"

[observability]
service_name = "plinth"
log_level = "debug"
otlp_endpoint = ""
otlp_headers = ""

[search]
default_limit = 10
related_limit = 5
min_similarity = 0.5

[content]
words_per_minute = 200
vector_truncation = 5000

[immich]
api_url = ""

[images]
cache_max_age = 31536000

[feeds]
blog_limit = 50
projects_limit = 50
activity_limit = 50

[forge]
refresh_ttl_secs = 3600
refresh_backoff_secs = 900
github_base_url = "https://api.github.com"
codeberg_base_url = "https://codeberg.org/api/v1"
# tokens via GITHUB_TOKEN / CODEBERG_TOKEN env vars, not here

[donation]
enabled = true
cta_text = "If you found this useful, consider supporting my work."

[[donation.links]]
platform = "kofi"
url = "https://ko-fi.com/caniko"

[[donation.links]]
platform = "github_sponsors"
url = "https://github.com/sponsors/caniko"

[[donation.links]]
platform = "liberapay"
url = "https://liberapay.com/caniko"
