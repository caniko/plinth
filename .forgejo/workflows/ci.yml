name: CI

on:
  push:
    branches: [trunk]
    tags: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Nix builds must use the host daemon so the Atlas store, post-build hook,
    # and rs-harbor sandbox-local compiler-cache namespace are shared across
    # this workflow.
    runs-on: atlas-nix-trusted
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check build-version contract
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.build-contract-version-check \
            .#checks.x86_64-linux.wasm-bindgen-version-check

      - name: Run flake checks
        run: nix flake check --keep-going --print-build-logs --no-update-lock-file

      - name: Build release and support outputs
        run: |
          nix build --print-out-paths --no-update-lock-file \
            .#plinth \
            .#plinth-cli \
            .#plinth-dev \
            .#plinth-minimal \
            .#docs \
            .#site \
            .#docs-full

  publish-cache:
    runs-on: atlas-nix-trusted
    needs: validate
    if: github.ref == 'refs/heads/trunk' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Reuse built paths
        run: |
          nix build --no-link --print-out-paths --no-update-lock-file \
            .#plinth \
            .#plinth-cli \
            .#site \
            .#docs-full > paths.txt

      - name: Push protected outputs to Attic
        run: |
          nix shell --inputs-from . nixpkgs#attic-client --command attic login canix \
            https://attic.candee.baby/canix "$(cat "$ATTIC_TOKENS_DIR/plinth")"
          nix shell --inputs-from . nixpkgs#attic-client --command attic push canix $(cat paths.txt)
