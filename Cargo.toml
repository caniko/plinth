[workspace]
resolver = "2"
members = [
  "crates/shared",
  "crates/client",
  "crates/server",
  "crates/cli",
  "crates/forge",
  "crates/person",
  "crates/project",
  "crates/pcomfy",
  "crates/dioxus-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.metadata.crane]
name = "plinth-workspace"

[workspace.dependencies]
# Internal crates
plinth-shared = { path = "crates/shared", default-features = false }
plinth-client = { path = "crates/client", default-features = false }
plinth-forge = { path = "crates/forge" }
plinth-person = { path = "crates/person" }
plinth-project = { path = "crates/project" }

# Legacy Leptos rollback/test surface (removed after the staging window).
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }

# Dioxus migration surface (stable 0.7; the alpha line is not used in production).
# The web crate owns the target-specific `web`/`server` feature split.
dioxus = { version = "=0.7.10", default-features = false, features = ["lib", "fullstack", "router", "launch", "asset"] }
dioxus-router = "=0.7.10"
tartan-ui-core = { git = "https://codeberg.org/caniko/tartan-ui.git", rev = "f4a591ccc2d676451772032c07dfbbf66a0629f0" }
tartan-ui-dioxus = { git = "https://codeberg.org/caniko/tartan-ui.git", rev = "f4a591ccc2d676451772032c07dfbbf66a0629f0", default-features = false }

# Server
axum = { version = "0.8" }
tokio = { version = "1" }
futures = { version = "0.3" }
tower = { version = "0.5" }
tower-http = { version = "0.6" }

# Observability
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
tracing-journald = { version = "0.3" }
opentelemetry = { version = "0.31" }
opentelemetry-otlp = { version = "0.31" }
opentelemetry_sdk = { version = "0.31" }
tracing-opentelemetry = { version = "0.32" }

# Actor System
kameo = { version = "0.19" }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "chrono", "uuid", "migrate", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
tonic = { version = "0.14" }

# Vector Embeddings
fastembed = { version = "5" }

# Content Processing
pulldown-cmark = { version = "0.13" }
gray_matter = { version = "0.3" }

# Error Handling
thiserror = { version = "2" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml = { version = "0.9" }
toml = { version = "0.9" }

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4" }
clap_complete = { version = "4" }
clap_complete_nushell = { version = "4" }
anyhow = { version = "1" }
console = { version = "0.16" }
indicatif = { version = "0.18" }
inquire = { version = "0.9", features = ["editor"] }

# HTTP Client
reqwest = { version = "0.13" }

# Local development tools
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
open = { version = "5" }

# UUID
uuid = { version = "1", features = ["v4"] }

# Typst
typst-as-lib = { version = "0.15" }
typst-html = { version = "0.14" }

# Rate Limiting
tower_governor = { version = "0.8" }

# RSS
rss = { version = "2.0" }

# Regex / Misc
regex = { version = "1" }
mime_guess = { version = "2" }
sha2 = { version = "0.10" }

# WASM
console_error_panic_hook = { version = "0.1" }
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3" }
gloo-net = { version = "0.6" }
percent-encoding = { version = "2.3" }
send_wrapper = { version = "0.6" }

# Legacy cargo-leptos profile retained solely for rollback builds.
[[workspace.metadata.leptos]]
name = "plinth"
bin-package = "plinth-server"
lib-package = "plinth-client"

# The site root folder is where cargo-leptos generate all output
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
site-pkg-dir = "pkg"

# The tailwind input file
tailwind-input-file = "input.css"

# Assets source dir
assets-dir = "public"

# The IP and port where the server serves the content
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# The browserlist query used for optimizing the CSS
browserquery = "defaults"

# The features to use when compiling the bin target
bin-features = ["ssr", "islands", "brick-blog", "brick-portfolio", "brick-todo", "brick-activity"]

# If the --no-default-features flag should be used when compiling the bin target
bin-default-features = false

# The features to use when compiling the lib target (client package)
lib-features = ["hydrate", "islands", "brick-blog", "brick-portfolio", "brick-todo", "brick-activity"]

# If the --no-default-features flag should be used when compiling the lib target
lib-default-features = false

# Enable cargo-leptos island output for the SSR + hydrate build.
islands = true

# The profile to use for the lib target when compiling for release
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
