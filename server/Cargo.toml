[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["ssr"]

[dependencies]
# Workspace dependencies
client = { path = "../client", default-features = false, features = ["hydrate"] }
shared = { path = "../shared" }

# Leptos SSR
leptos = { version = "0.7", features = ["ssr"] }
leptos_meta = { version = "0.7", features = ["ssr"] }
leptos_router = { version = "0.7", features = ["ssr"] }
leptos_axum = { version = "0.7", optional = true }

# Server
axum = { version = "0.8", optional = true, features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }

# Observability & Tracing (OPTIONAL - gated by ssr feature)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
opentelemetry = { version = "0.26", optional = true }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.27", optional = true }

# Actor System
kameo = { version = "0.14", optional = true }

# Database & Vector Search
surrealdb = { version = "2.0", optional = true }
fastembed = { version = "4", optional = true }

# Content Processing
pulldown-cmark = "0.12"
gray_matter = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[features]
default = ["ssr"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:kameo",
    "dep:surrealdb",
    "dep:fastembed",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
# Output name for the server binary and WASM
output-name = "personal-website"

# The site root folder is where cargo-leptos generate all output
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
site-pkg-dir = "pkg"

# The source style file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS.
style-file = "../input.css"

# The tailwind input file
tailwind-input-file = "../input.css"

# The tailwind config file
tailwind-config-file = "../tailwind.config.js"

# Assets source dir. All files found here will be copied and synchronized to site-root.
assets-dir = "../public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content
site-addr = "127.0.0.1:3000"

# The port to use for automatic reload monitoring
reload-port = 3001

# The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually `DEV` or `PROD`
env = "DEV"

# The features to use when compiling the bin target
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
bin-default-features = false

# The features to use when compiling the lib target (client package)
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
lib-default-features = false

# The profile to use for the lib target when compiling for release
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
