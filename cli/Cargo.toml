[package]
name = "blog-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "blog-cli"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
shared = { path = "../shared" }

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

# Content processing
pulldown-cmark = "0.12"
gray_matter = "0.2"

# Vector embeddings
fastembed = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
